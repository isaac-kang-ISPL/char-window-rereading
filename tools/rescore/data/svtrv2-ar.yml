# SVTRv2-AR (SVTRv2 encoder + NRTR decoder) for inference with the public UnionST-U14MFilter checkpoint.
# The inference part of the training configuration of this recognizer: dictionary, maximum length and space handling,
# the architecture, and the label decoder. character_dict_path is relative to the repository root
# (tools.rescore.window_score.reader_config resolves it, so the working directory does not matter).

Global:
  character_dict_path: &character_dict_path ./strtrain/utils/EN_symbol_dict.txt   # 94 printable characters
  max_text_length: &max_text_length 25
  use_space_char: &use_space_char False

Architecture:
  model_type: rec
  algorithm: NRTR
  in_channels: 3
  Transform:
  Encoder:
    name: SVTRv2LNConvTwo33
    use_pos_embed: False
    dims: [128, 256, 384]
    depths: [6, 6, 6]
    num_heads: [4, 8, 12]
    mixer: [['Conv','Conv','Conv','Conv','Conv','Conv'],['Conv','Conv','FGlobal','Global','Global','Global'],['Global','Global','Global','Global','Global','Global']]
    local_k: [[5, 5], [5, 5], [-1, -1]]
    sub_k: [[1, 1], [2, 1], [-1, -1]]
    last_stage: False
    feat2d: False
  Decoder:
    name: NRTRDecoder
    num_encoder_layers: -1
    beam_size: 0          # beam search runs in tools.rescore.nbest, not in the decoder
    num_decoder_layers: 2
    nhead: 12
    max_len: *max_text_length

PostProcess:
  name: ARLabelDecode
  character_dict_path: *character_dict_path
  use_space_char: *use_space_char
